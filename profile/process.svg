<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="262" viewBox="0 0 1200 262" role="img" aria-label="Proceso de Mantle Core Labs en 7 etapas: 1 Auditoría Operativa gratis de 30 a 45 minutos; 2 Propuesta a Medida, 5 a 7 días después; 3 Acuerdo y Cierre, cuando vos lo decidas; 4 Análisis Profundo, sprint inicial de 5 a 10 días; 5 Construcción por Sprints con entregables cada semana; 6 Pruebas y Documentación con datos reales; 7 Entrega y Seguimiento con 30 días de ajuste.">
  <defs><style>
    @font-face { font-family: "Geist"; font-weight: 500; src: url(data:font/woff2;base64,) format("woff2"); }
    text { font-family: "Geist", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-weight: 500; text-anchor: middle; }
    .line { stroke-dasharray: 1000; animation: draw 2.2s cubic-bezier(0.65, 0, 0.35, 1) 0.3s both; }
    .step { animation: in 0.7s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    @keyframes in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .line, .step { animation: none; } }
  </style></defs>
  <rect x="0.5" y="0.5" width="1199" height="261" rx="15.5" fill="#0A0A0A" stroke="#2A2A2A"/>
  <path d="M100 72H1100" stroke="#2A2A2A" stroke-width="2"/>
  <path class="line" d="M100 72H1100" stroke="#F5E9D0" stroke-width="2"/>
    <g class="step" style="animation-delay:0.35s"><circle cx="100.0" cy="72" r="6" fill="#0A0A0A" stroke="#F5E9D0" stroke-width="1.5"/><text x="100.0" y="118" font-size="12" letter-spacing="1.5" fill="#707070">ETAPA 1</text><text x="100.0" y="146" font-size="18" fill="#FFFFFF">Auditoría</text><text x="100.0" y="169" font-size="18" fill="#FFFFFF">Operativa</text><text x="100.0" y="204" font-size="14" fill="#808080">30 a 45 minutos</text><text x="100.0" y="223" font-size="14" fill="#808080">sin costo</text><rect x="67.7" y="22" width="64.6" height="22" rx="11" fill="none" stroke="#4FD1FF" stroke-opacity="0.45"/><text x="100.0" y="37" font-size="11" letter-spacing="1.2" fill="#4FD1FF">GRATIS</text></g>
  <g class="step" style="animation-delay:0.65s"><circle cx="266.7" cy="72" r="6" fill="#0A0A0A" stroke="#F5E9D0" stroke-width="1.5"/><text x="266.7" y="118" font-size="12" letter-spacing="1.5" fill="#707070">ETAPA 2</text><text x="266.7" y="146" font-size="18" fill="#FFFFFF">Propuesta</text><text x="266.7" y="169" font-size="18" fill="#FFFFFF">a Medida</text><text x="266.7" y="204" font-size="14" fill="#808080">5 a 7 días después</text><text x="266.7" y="223" font-size="14" fill="#808080">de la auditoría</text></g>
  <g class="step" style="animation-delay:0.95s"><circle cx="433.3" cy="72" r="6" fill="#0A0A0A" stroke="#F5E9D0" stroke-width="1.5"/><text x="433.3" y="118" font-size="12" letter-spacing="1.5" fill="#707070">ETAPA 3</text><text x="433.3" y="146" font-size="18" fill="#FFFFFF">Acuerdo</text><text x="433.3" y="169" font-size="18" fill="#FFFFFF">y Cierre</text><text x="433.3" y="204" font-size="14" fill="#808080">Cuando vos</text><text x="433.3" y="223" font-size="14" fill="#808080">lo decidas</text></g>
  <g class="step" style="animation-delay:1.25s"><circle cx="600.0" cy="72" r="6" fill="#0A0A0A" stroke="#F5E9D0" stroke-width="1.5"/><text x="600.0" y="118" font-size="12" letter-spacing="1.5" fill="#707070">ETAPA 4</text><text x="600.0" y="146" font-size="18" fill="#FFFFFF">Análisis</text><text x="600.0" y="169" font-size="18" fill="#FFFFFF">Profundo</text><text x="600.0" y="204" font-size="14" fill="#808080">Sprint inicial</text><text x="600.0" y="223" font-size="14" fill="#808080">de 5 a 10 días</text></g>
  <g class="step" style="animation-delay:1.55s"><circle cx="766.7" cy="72" r="15" fill="#F5E9D0" opacity="0.12"/><circle cx="766.7" cy="72" r="8" fill="#0A0A0A" stroke="#F5E9D0" stroke-width="2"/><text x="766.7" y="118" font-size="12" letter-spacing="1.5" fill="#707070">ETAPA 5</text><text x="766.7" y="146" font-size="18" fill="#FFFFFF">Construcción</text><text x="766.7" y="169" font-size="18" fill="#FFFFFF">por Sprints</text><text x="766.7" y="204" font-size="14" fill="#808080">Entregables</text><text x="766.7" y="223" font-size="14" fill="#808080">cada semana</text></g>
  <g class="step" style="animation-delay:1.85s"><circle cx="933.3" cy="72" r="6" fill="#0A0A0A" stroke="#F5E9D0" stroke-width="1.5"/><text x="933.3" y="118" font-size="12" letter-spacing="1.5" fill="#707070">ETAPA 6</text><text x="933.3" y="146" font-size="18" fill="#FFFFFF">Pruebas y</text><text x="933.3" y="169" font-size="18" fill="#FFFFFF">Documentación</text><text x="933.3" y="204" font-size="14" fill="#808080">Validación con</text><text x="933.3" y="223" font-size="14" fill="#808080">datos reales</text></g>
  <g class="step" style="animation-delay:2.15s"><circle cx="1100.0" cy="72" r="7" fill="#F5E9D0"/><text x="1100.0" y="118" font-size="12" letter-spacing="1.5" fill="#707070">ETAPA 7</text><text x="1100.0" y="146" font-size="18" fill="#FFFFFF">Entrega y</text><text x="1100.0" y="169" font-size="18" fill="#FFFFFF">Seguimiento</text><text x="1100.0" y="204" font-size="14" fill="#808080">Acompañamiento</text><text x="1100.0" y="223" font-size="14" fill="#808080">+ 30 días de ajuste</text></g>
</svg>
